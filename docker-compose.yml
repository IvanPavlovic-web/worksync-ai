services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: worksync_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: worksync
      POSTGRES_PASSWORD: worksync
      POSTGRES_DB: worksync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worksync"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: worksync_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: worksync_search
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: worksync-master-key-change-me
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

volumes:
  pgdata:
  redisdata:
  meilidata:
